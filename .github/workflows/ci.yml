name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust stable
        run: rustup update stable --no-self-update && rustup default stable
      - name: Build dashboard assets
        run: npm ci --prefix dashboard && npm run build --prefix dashboard
      - run: python3 scripts/release.py --check
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 tests/e2e.py target/debug/ylcc
      - run: cargo build --locked --release
      - run: bash scripts/test-install.sh
      - name: CLI smoke test
        run: target/release/ylcc --help && target/release/ylcc --version
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust stable
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - name: Build dashboard assets
        run: npm ci --prefix dashboard; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npm run build --prefix dashboard; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python tests/e2e.py target/debug/ylcc.exe
      - name: Windows PowerShell 5.1 installer checks
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/test-install.ps1
      - name: CLI smoke test
        run: |
          ./target/debug/ylcc.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/debug/ylcc.exe --version
      - run: cargo build --locked --release
      - name: Package Windows preview for real-machine validation
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/ylcc.exe,LICENSE,THIRD_PARTY_NOTICES.txt dist/
          Compress-Archive -Path dist/ylcc.exe,dist/LICENSE,dist/THIRD_PARTY_NOTICES.txt -DestinationPath ylcc-windows-x86_64.zip
          $hash = (Get-FileHash ylcc-windows-x86_64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS'), "$hash  ylcc-windows-x86_64.zip`n")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ylcc-windows-x86_64-preview
          path: |
            ylcc-windows-x86_64.zip
            SHA256SUMS
          if-no-files-found: error
  windows-container:
    needs: windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Windows container daemon preflight
        run: |
          docker version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dockerOS = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($dockerOS -ne 'windows') { throw 'This job requires a Windows container Docker engine.' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ylcc-windows-x86_64-preview
      - name: Prepare the tested Windows binary
        run: Expand-Archive -LiteralPath ylcc-windows-x86_64.zip -DestinationPath dist
      - name: Build Windows Server Core runtime and CI image
        run: |
          docker build --isolation=process --file Dockerfile.windows --target runtime --tag ylcc-windows:runtime .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker build --isolation=process --file Dockerfile.windows --target test --tag ylcc-windows:test .
      - name: Verify Windows ContainerUser jobs and persistent volume
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/test-windows-image.ps1
