name: Release
# Cargo.toml's version is the only release input: a commit on main that changes it to an
# unreleased version gets tagged and published here (scripts/release.py makes that commit).
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  YLCC_RELEASE: '1'
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select an unreleased package version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release.py --check
          tag="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          tagged="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk '{print $1}' | tail -n 1)"
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "$tag already tags $tagged; bump Cargo.toml with scripts/release.py" >&2; exit 1
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "$tag is already published"; exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    if: needs.version.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            os: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            os: macos
            arch: x86_64
            target: x86_64-apple-darwin
          - runner: macos-15
            os: macos
            arch: aarch64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust stable
        run: rustup update stable --no-self-update && rustup default stable && rustup target add '${{ matrix.target }}' && rustup component add rust-docs
      - name: Build dashboard assets
        run: npm ci --prefix dashboard && npm run build --prefix dashboard
      - name: Test and build on the target architecture
        env:
          CC: ${{ matrix.os == 'linux' && 'gcc' || 'clang' }}
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          cargo fetch --locked
          python3 scripts/generate-notices.py --output THIRD_PARTY_NOTICES.txt
          cargo test --locked --target '${{ matrix.target }}'
          cargo build --locked --release --target '${{ matrix.target }}'
          python3 tests/e2e.py 'target/${{ matrix.target }}/release/ylcc'
          bash scripts/test-install.sh
          mkdir -p dist
          cp 'target/${{ matrix.target }}/release/ylcc' dist/ylcc
          cp LICENSE dist/LICENSE
          python3 scripts/generate-notices.py --output dist/THIRD_PARTY_NOTICES.txt
          dist/ylcc --version
          tar -czf 'ylcc-${{ matrix.os }}-${{ matrix.arch }}.tar.gz' -C dist ylcc LICENSE THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ylcc-${{ matrix.os }}-${{ matrix.arch }}
          path: ylcc-*.tar.gz
          if-no-files-found: error
  build-windows:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust stable
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add rust-docs
      - name: Build dashboard assets
        run: npm ci --prefix dashboard; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npm run build --prefix dashboard; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: cargo fetch --locked
      - run: python scripts/generate-notices.py --output THIRD_PARTY_NOTICES.txt
      - run: cargo test --locked --target x86_64-pc-windows-msvc
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - run: python tests/e2e.py target/x86_64-pc-windows-msvc/release/ylcc.exe
      - name: Windows PowerShell 5.1 installer checks
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/test-install.ps1
      - name: Package the tested Windows binary
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/ylcc.exe dist/ylcc.exe
          Copy-Item LICENSE dist/LICENSE
          python scripts/generate-notices.py --output dist/THIRD_PARTY_NOTICES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./dist/ylcc.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/ylcc.exe,dist/LICENSE,dist/THIRD_PARTY_NOTICES.txt -DestinationPath ylcc-windows-x86_64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ylcc-windows-x86_64
          path: ylcc-windows-x86_64.zip
          if-no-files-found: error
  image:
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            platform: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            platform: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ylcc-linux-${{ matrix.arch }}
      - name: Prepare tested binary
        run: mkdir -p dist && tar -xzf 'ylcc-linux-${{ matrix.arch }}.tar.gz' -C dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.platform }}
          push: true
          tags: ghcr.io/semanticist21/your-local-cloud-computing:sha-${{ github.sha }}-${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/semanticist21/your-local-cloud-computing
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
  image-windows:
    needs: build-windows
    runs-on: windows-2022
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Windows container daemon preflight
        run: |
          docker version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dockerOS = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($dockerOS -ne 'windows') { throw 'This job requires a Windows container Docker engine.' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ylcc-windows-x86_64
      - name: Prepare the tested Windows binary
        run: Expand-Archive -LiteralPath ylcc-windows-x86_64.zip -DestinationPath dist
      - name: Build Windows Server Core runtime and CI image
        run: |
          docker build --isolation=process --file Dockerfile.windows --target runtime --tag ylcc-windows:runtime .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker build --isolation=process --file Dockerfile.windows --target test --tag ylcc-windows:test .
      - name: Verify Windows ContainerUser jobs and persistent volume
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/test-windows-image.ps1
      - name: Publish the tested Windows image by source revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:GH_TOKEN | docker login ghcr.io --username '${{ github.actor }}' --password-stdin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker tag ylcc-windows:runtime ghcr.io/semanticist21/your-local-cloud-computing:sha-${{ github.sha }}-windows-ltsc2022
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker push ghcr.io/semanticist21/your-local-cloud-computing:sha-${{ github.sha }}-windows-ltsc2022
  publish:
    needs: [version, build, build-windows, image, image-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ylcc-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable-version image manifest and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          test "${RELEASE_TAG#v}" != "$RELEASE_TAG"
          version="${RELEASE_TAG#v}"
          docker buildx imagetools create -t "ghcr.io/semanticist21/your-local-cloud-computing:$version" \
            'ghcr.io/semanticist21/your-local-cloud-computing:sha-${{ github.sha }}-amd64' \
            'ghcr.io/semanticist21/your-local-cloud-computing:sha-${{ github.sha }}-arm64'
          docker buildx imagetools create --prefer-index=false -t "ghcr.io/semanticist21/your-local-cloud-computing:$version-windows-ltsc2022" \
            'ghcr.io/semanticist21/your-local-cloud-computing:sha-${{ github.sha }}-windows-ltsc2022'
          (cd dist && sha256sum ylcc-*.tar.gz ylcc-*.zip > SHA256SUMS)
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$RELEASE_TAG" --yes
          fi
          gh release create "$RELEASE_TAG" dist/ylcc-*.tar.gz dist/ylcc-*.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
